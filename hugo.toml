baseURL = 'https://aubaine-creation.fr/website'
canonifyURLs = true
languageCode = 'fr-fr'
defaultContentLanguage = 'fr'
title = 'Aubaine Création'

[permalinks.page]
  projects = '/projets/:year-:slug'
[permalinks.section]
  projects = '/projets/'
[permalinks.term]
  projects_clients = '/projets/clients/:slug'
  projects_tags = '/projets/tags/:slug'
  projects_types = '/projets/types/:slug'
[permalinks.taxonomy]
  projects_clients = '/projets/clients/'
  projects_tags = '/projets/tags/'
  projects_types = '/projets/types/'

[taxonomies]
  category = 'categories'
  tag = 'tags'
  projects_client = 'projects_clients'
  projects_tag = 'projects_tags'
  projects_type = 'projects_types'

[module]
  # Dossiers du projet (réglages standard d'Hugo)
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # Les médias ajoutés dans Sveltia : publiés tels quels (vidéos)
  # et aussi utilisables pour l'optimisation des images
  [[module.mounts]]
    source = 'static/images/uploads'
    target = 'assets/images/uploads'
  # Sveltia écrit parfois « /static/images/uploads/… » : on accepte aussi ce chemin
  [[module.mounts]]
    source = 'static/images/uploads'
    target = 'assets/static/images/uploads'
  # Le thème passe en premier : ses réglages sont prioritaires
  [[module.imports]]
    path = 'mon-site'
  [[module.imports]]
    path = 'github.com/hugolify/hugolify-admin'

# Interface d'édition : http://localhost:1313/admin/
[params.admin]
  repo = 'audreyhaman/aubaine-creation'
  # Médias enregistrés dans le projet (et non sur le compte Uploadcare de l'auteur du thème)
  [params.admin.media]
    cloud = false
    media_folder = "/static/images/uploads"
    public_folder = "/images/uploads"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[build.buildStats]
  enable = true