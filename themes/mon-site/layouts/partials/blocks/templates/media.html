{{- if .items }}
<section class="block-media layout-{{ .layout | default "inline" }}" {{- partial "func/SetAnim.html" (dict "element" "block") }}>
  <div class="container">
    <div class="media-items">
      {{- range .items }}
        {{- if .src }}
          {{- $size := .size | default "full" -}}
          {{ partial "commons/figure.html" (dict
            "src" .src
            "alt" .alt
            "desktop" site.Params.image.desktop
            "figure_class" (printf "media-item size-%s" $size)
          ) }}
        {{- end }}
      {{- end }}
    </div>
  </div>
</section>
{{- end }}
